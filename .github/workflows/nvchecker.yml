name: Check package updates (nvchecker)

on:
  schedule:
    # Daily at 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvchecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/check-updates.py
          scripts/check-updates.py \
            --body-file "${RUNNER_TEMP}/nvchecker-body.txt" \
            --github-output "${GITHUB_OUTPUT}"
          {
            echo "## nvchecker report"
            echo ""
            cat "${RUNNER_TEMP}/nvchecker-body.txt"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Send email
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.check.outputs.subject }}
          to: brianrobt@pm.me
          from: "AUR nvchecker <${{ secrets.MAIL_USERNAME }}>"
          body: file://${{ runner.temp }}/nvchecker-body.txt
 